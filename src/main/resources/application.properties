# ============================================================
#  NexaPM — Application Configuration
# ============================================================
spring.application.name=NexaPM

# Server
server.port=8080
server.servlet.context-path=/api/v1

# ============================================================
#  Database — PostgreSQL
#  Sobreescribe con variables de entorno en produccion/Docker
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexapm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate crea las tablas ANTES de que corra data.sql
spring.jpa.defer-datasource-initialization=true

# ============================================================
#  SQL Initializer — src/main/resources/data.sql
#  Usa DO $$ IF NOT EXISTS $$ — idempotente en reinicios
# ============================================================
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ============================================================
#  JWT — JSON Web Token
#  Secret: base64 de "nexapm-super-secret-jwt-key-2026-minimum-32-bytes!"
# ============================================================
app.jwt.secret=${JWT_SECRET:bmV4YXBtLXN1cGVyLXNlY3JldC1qd3Qta2V5LTIwMjYtbWluaW11bS0zMi1ieXRlcyE=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================================
#  SpringDoc — Swagger UI / OpenAPI 3
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# ============================================================
#  Logging
# ============================================================
logging.level.com.jay17.nexapm=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN